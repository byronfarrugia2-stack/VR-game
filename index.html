<!doctype html>
<html>

<head>
  <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
</head>

<body>

  <a-scene>

    <!-- Player -->
    <a-entity 
      id="player"
      camera
      wasd-controls
      look-controls
      position="0 1.6 0">
    </a-entity>

    <!-- LAB ROOM (big box room) -->
    <a-box 
      position="0 5 -10"
      width="40"
      height="10"
      depth="40"
      color="#E0E0E0"
      material="side: double; opacity: 0.95">
    </a-box>

    <!-- FLOOR -->
    <a-plane
      position="0 0 -10"
      rotation="-90 0 0"
      width="40"
      height="40"
      color="#FFFFFF"
      material="metalness: 0.2; roughness: 0.1">
    </a-plane>

    <!-- CEILING LIGHTS -->
    <a-box position="-10 9 -10" width="6" height="0.2" depth="1" color="#FFFFFF"></a-box>
    <a-box position="0 9 -10" width="6" height="0.2" depth="1" color="#FFFFFF"></a-box>
    <a-box position="10 9 -10" width="6" height="0.2" depth="1" color="#FFFFFF"></a-box>

    <!-- LAB TABLES -->
    <a-box position="-10 1 -5" width="6" height="1" depth="2" color="#CCCCCC"></a-box>
    <a-box position="5 1 -15" width="6" height="1" depth="2" color="#CCCCCC"></a-box>

    <!-- COMPUTERS -->
    <a-box position="-10 2 -5" width="1" height="0.7" depth="0.1" color="#222222"></a-box>
    <a-box position="5 2 -15" width="1" height="0.7" depth="0.1" color="#222222"></a-box>

    <!-- GLOWING TUBES -->
    <a-cylinder 
      position="-5 2 -20"
      radius="0.5"
      height="4"
      color="#00FFFF"
      material="emissive: #00FFFF; emissiveIntensity: 0.6">
    </a-cylinder>

    <a-cylinder 
      position="-3 2 -20"
      radius="0.5"
      height="4"
      color="#FF00FF"
      material="emissive: #FF00FF; emissiveIntensity: 0.6">
    </a-cylinder>

    <!-- CONTAINMENT CHAMBER -->
    <a-box 
      position="10 2 -5"
      width="4"
      height="4"
      depth="4"
      color="#444444"
      material="opacity: 0.4; transparent: true">
    </a-box>

    <!-- Glowing mutation core inside -->
    <a-sphere
      position="10 2 -5"
      radius="1"
      color="#FF3300"
      material="emissive: #FF3300; emissiveIntensity: 0.8">
    </a-sphere>

  </a-scene>

</body>

</html>
