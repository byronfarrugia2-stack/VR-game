<!doctype html>
<html>
<head>
  <script src="https://aframe.io"></script>

  <script>
    // ===== GLOBAL GAME STATE =====
    const GameState = {
      contamination: 0,
      playerMarked: false,
      powerRestored: false,
      inEmergencyMode: false,
      jumpscareDone: false
    };

    function setContamination(delta) {
      GameState.contamination += delta;
      GameState.contamination = Math.max(0, Math.min(100, GameState.contamination));

      const contamText = document.querySelector('#contamText');
      if (contamText) {
        contamText.setAttribute('value', `Contamination: ${GameState.contamination}%`);
      }

      if (GameState.contamination >= 100) triggerFailureEnding();
    }

    function triggerFailureEnding() {
      const goalText = document.querySelector('#goalText');
      if (goalText) {
        goalText.setAttribute('value', 'FAILURE: Contamination reached 100%.');
        goalText.setAttribute('color', 'red');
        goalText.setAttribute('visible', true);
      }

      const ambient = document.querySelector('#ambientLight');
      const dir = document.querySelector('#dirLight');
      // FIXED: Pass multi-property components as objects
      if (ambient) ambient.setAttribute('light', { intensity: 0.1 });
      if (dir) dir.setAttribute('light', { intensity: 0.1 });
    }

    // ===== LIGHTING MODES =====
    function setNormalLighting() {
      const ambient = document.querySelector('#ambientLight');
      const dir = document.querySelector('#dirLight');
      // FIXED: Pass multi-property components as objects
      if (ambient) ambient.setAttribute('light', { intensity: 0.5 });
      if (dir) dir.setAttribute('light', { intensity: 0.8 });
      GameState.inEmergencyMode = false;
    }

    function setEmergencyLighting() {
      const ambient = document.querySelector('#ambientLight');
      const dir = document.querySelector('#dirLight');
      // FIXED: Pass multi-property components as objects
      if (ambient) ambient.setAttribute('light', { intensity: 0.1 });
      if (dir) dir.setAttribute('light', { intensity: 0.25 });
      GameState.inEmergencyMode = true;
    }

    // ===== INTRO SEQUENCE =====
    window.addEventListener('load', () => {
      const introVoice = document.querySelector('#introVoice');
      // FIXED: Safely closed the event listener and handled logic
      console.log("Game loaded. Current contamination:", GameState.contamination);
    });
  </script>
</head>
<body>
  <a-scene>
    <!-- Assets -->
    <a-assets>
      <audio id="introVoice" src="your-audio-file.mp3" preload="auto"></audio>
    </a-assets>

    <!-- Lights -->
    
    

    <!-- UI / Text Elements -->
    <a-text id="contamText" value="Contamination: 0%" position="-1 2 -3" color="#FFF"></a-text>
    <a-text id="goalText" value="" position="-1 1.5 -3" visible="false"></a-text>

    <!-- Camera -->
    
  </a-scene>
</body>
</html>
