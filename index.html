<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Bright Sci‑Fi Lab</title>
  <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>

  <style>
    body { margin: 0; background: #000; }
    #hint {
      position: fixed;
      bottom: 10px;
      left: 10px;
      color: #333;
      font-family: sans-serif;
      background: rgba(255,255,255,0.7);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 13px;
      z-index: 10;
    }
  </style>

  <script>
    /* SIMPLE COLLISION SYSTEM */
    AFRAME.registerComponent('player-collider', {
      schema: { radius: {default: 0.45}, height: {default: 1.6} },
      init: function () {
        this.prev = new THREE.Vector3();
        this.tmpBox = new THREE.Box3();
        this.colliders = [];
        this.updateColliders();
        const obs = new MutationObserver(() => this.updateColliders());
        obs.observe(this.el.sceneEl, { childList: true, subtree: true });
      },
      updateColliders: function () {
        this.colliders = Array.from(
          this.el.sceneEl.querySelectorAll('.collidable')
        ).map(e => e.object3D);
      },
      tick: function () {
        const rig = this.el;
        this.prev.copy(rig.object3D.position);
        const pos = rig.object3D.position;

        const playerBox = new THREE.Box3(
          new THREE.Vector3(pos.x - this.data.radius, pos.y - 0.1, pos.z - this.data.radius),
          new THREE.Vector3(pos.x + this.data.radius, pos.y + this.data.height, pos.z + this.data.radius)
        );

        for (let obj of this.colliders) {
          this.tmpBox.setFromObject(obj);
          if (this.tmpBox.isEmpty()) continue;
          this.tmpBox.expandByScalar(0.05);
          if (playerBox.intersectsBox(this.tmpBox)) {
            rig.object3D.position.copy(this.prev);
            return;
          }
        }
      }
    });

    /* SWITCHES */
    AFRAME.registerComponent('click-switch', {
      init: function () {
        this.on = false;
        this.el.setAttribute('color', '#cc0000');
        this.el.addEventListener('click', () => {
          this.on = !this.on;
          this.el.setAttribute('color', this.on ? '#00cc44' : '#cc0000');
        });
      }
    });
  </script>
</head>

<body>
<div id="hint">WASD to move • Mouse to look • Click switches</div>

<a-scene background="color: #e6e6e6">

  <!-- PLAYER -->
  <a-entity id="rig" position="0 1.6 6" player-collider>
    <a-entity camera look-controls wasd-controls="acceleration: 30"></a-entity>
  </a-entity>

  <!-- BRIGHT LAB LIGHTING -->
  <a-entity light="type: ambient; intensity: 0.7; color: #ffffff"></a-entity>
  <a-entity light="type: directional; intensity: 1.2; color: #ffffff" position="6 10 6"></a-entity>

  <!-- ROOM -->
  <a-box class="collidable" position="0 0 -8" width="26" height="0.2" depth="18" color="#f2f2f2"></a-box>
  <a-box class="collidable" position="0 6 -8" width="26" height="0.2" depth="18" color="#ffffff"></a-box>

  <a-box class="collidable" position="0 3 -17" width="26" height="6" depth="0.2" color="#d9d9d9"></a-box>
  <a-box class="collidable" position="0 3 1"   width="26" height="6" depth="0.2" color="#d9d9d9"></a-box>
  <a-box class="collidable" position="-13 3 -8" width="0.2" height="6" depth="18" color="#d9d9d9"></a-box>
  <a-box class="collidable" position="13 3 -8"  width="0.2" height="6" depth="18" color="#d9d9d9"></a-box>

  <!-- CEILING LIGHT PANELS -->
  <a-box position="-6 5.8 -8" width="4" height="0.12" depth="2"
         color="#ffffff" material="emissive:#ffffff; emissiveIntensity:1"></a-box>
  <a-box position="0 5.8 -8"  width="4" height="0.12" depth="2"
         color="#ffffff" material="emissive:#ffffff; emissiveIntensity:1"></a-box>
  <a-box position="6 5.8 -8"  width="4" height="0.12" depth="2"
         color="#ffffff" material="emissive:#ffffff; emissiveIntensity:1"></a-box>

  <!-- LEFT BENCH -->
  <a-box class="collidable" position="-9 1 -6" width="8" height="1" depth="2.4" color="#cfcfcf"></a-box>

  <!-- Monitor -->
  <a-box class="collidable" position="-10.2 2 -6" width="1.6" height="0.9" depth="0.08" color="#333"></a-box>
  <a-plane position="-10.2 2 -5.95" width="1.4" height="0.8"
           color="#004466"
           material="emissive:#004466; emissiveIntensity:0.8">
    <a-text value="ANALYSIS FEED" position="-0.7 0.2 0.01" color="#aaffee" width="2.6"></a-text>
  </a-plane>

  <!-- Microscope -->
  <a-entity position="-7.2 1.2 -6.2">
    <a-cylinder radius="0.18" height="0.5" color="#555"></a-cylinder>
    <a-box position="0 0.4 0.25" width="0.36" height="0.18" depth="0.5" color="#333"></a-box>
  </a-entity>

  <!-- Petri dishes -->
  <a-cylinder position="-8.2 1.12 -5.4" radius="0.18" height="0.06"
              color="#00ff55"
              material="emissive:#00ff55; emissiveIntensity:0.7"></a-cylinder>

  <!-- RIGHT BENCH -->
  <a-box class="collidable" position="9 1 -10" width="8" height="1" depth="2.4" color="#cfcfcf"></a-box>

  <a-box class="collidable" position="10.2 2 -10" width="1.6" height="0.9" depth="0.08" color="#333"></a-box>
  <a-plane position="10.2 2 -9.95" width="1.4" height="0.8"
           color="#330033"
           material="emissive:#330033; emissiveIntensity:0.8">
    <a-text value="CONTAINMENT STATUS" position="-0.9 0.2 0.01" color="#ffddaa" width="2.8"></a-text>
  </a-plane>

  <!-- Bottles -->
  <a-cylinder class="collidable" position="8.2 1.2 -9.4" radius="0.16" height="0.5" color="#88ccff"></a-cylinder>
  <a-cylinder class="collidable" position="9.2 1.2 -9.4" radius="0.16" height="0.5" color="#ff88ff"></a-cylinder>

  <!-- CONTAINMENT POD -->
  <a-box class="collidable" position="0 1 -2" width="7" height="1" depth="4" color="#d0d0d0"></a-box>
  <a-box class="collidable" position="0 3 -2" width="5" height="4" depth="4"
         color="#eeeeee" material="opacity:0.3; transparent:true"></a-box>

  <a-sphere position="0 3 -2" radius="1.2" color="#ff3300"
            material="emissive:#ff3300; emissiveIntensity:1.1"
            animation="property: scale; dir: alternate; dur: 900; loop: true; to: 1.3 1.3 1.3"></a-sphere>

  <!-- POWER CONSOLE -->
  <a-box class="collidable" position="0 1 -14" width="12" height="1.2" depth="2.8" color="#d0d0d0"></a-box>

  <a-box position="-3 2 -13.6" width="0.6" height="1.1" depth="0.25" click-switch></a-box>
  <a-box position="0 2 -13.6"  width="0.6" height="1.1" depth="0.25" click-switch></a-box>
  <a-box position="3 2 -13.6"  width="0.6" height="1.1" depth="0.25" click-switch></a-box>

  <a-text id="goalText"
          value="Objective: Restore Power"
          position="-4 3 -13.4"
          color="#333"
          width="8"></a-text>

  <!-- EMERGENCY SCREENS -->
  <a-plane position="-9 4 -16" width="3.8" height="1.7"
           color="#aa0000"
           material="emissive:#aa0000; emissiveIntensity:1">
    <a-text value="VENT SYSTEM OVERRIDE"
            position="-1.7 0.3 0.01"
            color="#ffffff"
            width="3.4"></a-text>
  </a-plane>

  <a-plane position="9 4 -16" width="4.5" height="1.7"
           color="#aa0000"
           material="emissive:#aa0000; emissiveIntensity:1">
    <a-text value="CONTAINMENT OVERRIDE"
            position="-2.1 0.3 0.01"
            color="#ffffff"
            width="4.1"></a-text>
  </a-plane>

</a-scene>
</body>
</html>
