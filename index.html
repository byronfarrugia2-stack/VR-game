<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Containment Breach Lab</title>
  <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
  <style>
    body { margin: 0; background: #000; }
    #hint {
      position: fixed;
      bottom: 10px;
      left: 10px;
      color: #ccc;
      font-family: system-ui, sans-serif;
      background: rgba(0,0,0,0.6);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 13px;
      z-index: 10;
    }
  </style>

  <script>
    // --- Simple collision system (no physics engine) ---
    AFRAME.registerComponent('player-collider', {
      schema: { radius: {default: 0.45}, height: {default: 1.6} },
      init: function () {
        this.prev = new THREE.Vector3();
        this.tmpBox = new THREE.Box3();
        this.colliders = [];
        this.updateColliders();
        const obs = new MutationObserver(() => this.updateColliders());
        obs.observe(this.el.sceneEl, { childList: true, subtree: true });
      },
      updateColliders: function () {
        this.colliders = Array.from(
          this.el.sceneEl.querySelectorAll('.collidable')
        ).map(e => e.object3D);
      },
      tick: function () {
        const rig = this.el;
        this.prev.copy(rig.object3D.position);
        const pos = rig.object3D.position;

        const playerBox = new THREE.Box3(
          new THREE.Vector3(pos.x - this.data.radius, pos.y - 0.1, pos.z - this.data.radius),
          new THREE.Vector3(pos.x + this.data.radius, pos.y + this.data.height, pos.z + this.data.radius)
        );

        for (let obj of this.colliders) {
          this.tmpBox.setFromObject(obj);
          if (this.tmpBox.isEmpty()) continue;
          this.tmpBox.expandByScalar(0.05);
          if (playerBox.intersectsBox(this.tmpBox)) {
            rig.object3D.position.copy(this.prev);
            return;
          }
        }
      }
    });

    // --- Flicker for sparks / broken lights ---
    AFRAME.registerComponent('flicker', {
      schema: { min: 0.2, max: 1.3, speed: 120 },
      init: function () { this.t = 0; },
      tick: function (time, dt) {
        this.t += dt;
        if (this.t > this.data.speed) {
          const val = Math.random() * (this.data.max - this.data.min) + this.data.min;
          const mat = this.el.getAttribute('material') || {};
          mat.emissiveIntensity = val;
          this.el.setAttribute('material', mat);
          this.t = 0;
        }
      }
    });

    // --- Simple switch (for later puzzles) ---
    AFRAME.registerComponent('click-switch', {
      init: function () {
        this.on = false;
        this.el.setAttribute('color', '#aa2222');
        this.el.addEventListener('click', () => {
          this.on = !this.on;
          this.el.setAttribute('color', this.on ? '#22ff66' : '#aa2222');
        });
      }
    });
  </script>
</head>

<body>
<div id="hint">WASD to move • Mouse to look • Click red switches</div>

<a-scene background="color: #050608">

  <!-- PLAYER RIG -->
  <a-entity id="rig" position="0 1.6 6" player-collider>
    <a-entity camera look-controls wasd-controls="acceleration: 30"></a-entity>
  </a-entity>

  <!-- LIGHTING: soft white + strong red emergency -->
  <a-entity light="type: ambient; intensity: 0.35; color: #d0d0d0"></a-entity>
  <a-entity light="type: directional; intensity: 0.7; color: #ffffff" position="8 10 4"></a-entity>
  <a-entity light="type: point; intensity: 1.4; color: #ff2222" position="0 4 -8"></a-entity>

  <!-- FLOOR (dirty metal) -->
  <a-box class="collidable"
         position="0 0 -8"
         width="26" height="0.2" depth="18"
         color="#202326"
         material="metalness:0.4; roughness:0.8"></a-box>

  <!-- CEILING -->
  <a-box class="collidable"
         position="0 6 -8"
         width="26" height="0.2" depth="18"
         color="#111315"></a-box>

  <!-- WALLS -->
  <a-box class="collidable" position="0 3 -17" width="26" height="6" depth="0.2" color="#2a2d30"></a-box>
  <a-box class="collidable" position="0 3 1"   width="26" height="6" depth="0.2" color="#2a2d30"></a-box>
  <a-box class="collidable" position="-13 3 -8" width="0.2" height="6" depth="18" color="#2a2d30"></a-box>
  <a-box class="collidable" position="13 3 -8"  width="0.2" height="6" depth="18" color="#2a2d30"></a-box>

  <!-- Ceiling light strips -->
  <a-box position="-6 5.8 -8" width="4" height="0.12" depth="1.8"
         color="#f0f0f0" material="emissive:#f0f0f0; emissiveIntensity:0.7"></a-box>
  <a-box position="0 5.8 -8"  width="4" height="0.12" depth="1.8"
         color="#f0f0f0" material="emissive:#f0f0f0; emissiveIntensity:0.7"></a-box>
  <a-box position="6 5.8 -8"  width="4" height="0.12" depth="1.8"
         color="#f0f0f0" material="emissive:#f0f0f0; emissiveIntensity:0.7"></a-box>

  <!-- LEFT LAB BENCH -->
  <a-box class="collidable" position="-9 1 -6" width="8" height="1" depth="2.4" color="#3b3f44"></a-box>

  <!-- Left bench clutter: monitor, microscope, dishes, tools -->
  <a-box class="collidable" position="-10.2 2 -6" width="1.6" height="0.9" depth="0.08" color="#050608"></a-box>
  <a-plane position="-10.2 2 -5.95" width="1.4" height="0.8"
           color="#022b3a"
           material="emissive:#022b3a; emissiveIntensity:0.8">
    <a-text value="ANALYSIS FEED" position="-0.7 0.2 0.01" color="#8af5d0" width="2.6"></a-text>
  </a-plane>

  <a-entity position="-7.2 1.2 -6.2">
    <a-cylinder radius="0.18" height="0.5" color="#222"></a-cylinder>
    <a-box position="0 0.4 0.25" width="0.36" height="0.18" depth="0.5" color="#111"></a-box>
  </a-entity>

  <a-cylinder position="-8.2 1.12 -5.4" radius="0.18" height="0.06"
              color="#00ff55"
              material="emissive:#00ff55; emissiveIntensity:0.9"></a-cylinder>
  <a-cylinder position="-7.6 1.12 -5.4" radius="0.18" height="0.06"
              color="#ff66ff"
              material="emissive:#ff66ff; emissiveIntensity:0.7"></a-cylinder>

  <a-cylinder position="-7 1.3 -6.8" radius="0.16" height="0.5" color="#88ccff"></a-cylinder>
  <a-cylinder position="-6.4 1.3 -6.8" radius="0.16" height="0.5" color="#ffaa88"></a-cylinder>

  <!-- RIGHT LAB BENCH -->
  <a-box class="collidable" position="9 1 -10" width="8" height="1" depth="2.4" color="#3b3f44"></a-box>

  <a-box class="collidable" position="10.2 2 -10" width="1.6" height="0.9" depth="0.08" color="#050608"></a-box>
  <a-plane position="10.2 2 -9.95" width="1.4" height="0.8"
           color="#2b0033"
           material="emissive:#2b0033; emissiveIntensity:0.8">
    <a-text value="CONTAINMENT STATUS" position="-0.9 0.2 0.01" color="#ffd9a0" width="2.8"></a-text>
  </a-plane>

  <a-cylinder class="collidable" position="8.2 1.2 -9.4" radius="0.16" height="0.5" color="#88ccff"></a-cylinder>
  <a-cylinder class="collidable" position="9.2 1.2 -9.4" radius="0.16" height="0.5" color="#ff88ff"></a-cylinder>
  <a-cylinder class="collidable" position="10.2 1.2 -9.4" radius="0.16" height="0.5" color="#aaff88"></a-cylinder>

  <!-- CENTRAL CONTAINMENT POD -->
  <a-box class="collidable" position="0 1 -2" width="7" height="1" depth="4" color="#34383d"></a-box>
  <a-box class="collidable" position="0 3 -2" width="5" height="4" depth="4"
         color="#777"
         material="opacity:0.28; transparent:true"></a-box>

  <a-plane position="0 3 -0.6" width="3" height="2.8"
           color="#ffffff"
           material="opacity:0.14; transparent:true"></a-plane>

  <a-sphere position="0 3 -2" radius="1.2" color="#ff3300"
            material="emissive:#ff3300; emissiveIntensity:1.1"
            animation="property: scale; dir: alternate; dur: 900; loop: true; to: 1.3 1.3 1.3"></a-sphere>

  <a-circle position="0 1.05 -2" rotation="-90 0 0" radius="1.6"
            color="#00ff55"
            material="opacity:0.7; emissive:#00ff55; emissiveIntensity:0.8"></a-circle>

  <!-- SLIME PATCHES -->
  <a-plane position="-8 0.11 -6" rotation="-90 0 0" width="3" height="2"
           color="#00ff55"
           material="opacity:0.7; emissive:#00ff55; emissiveIntensity:0.7"></a-plane>
  <a-plane position="7.5 0.11 -11.5" rotation="-90 0 0" width="3" height="2"
           color="#00ff55"
           material="opacity:0.7; emissive:#00ff55; emissiveIntensity:0.7"></a-plane>

  <!-- BACK POWER CONSOLE -->
  <a-box class="collidable" position="0 1 -14" width="12" height="1.2" depth="2.8" color="#30353a"></a-box>

  <a-box position="-3 2 -13.6" width="0.6" height="1.1" depth="0.25" click-switch></a-box>
  <a-box position="0 2 -13.6"  width="0.6" height="1.1" depth="0.25" click-switch></a-box>
  <a-box position="3 2 -13.6"  width="0.6" height="1.1" depth="0.25" click-switch></a-box>

  <a-text id="goalText"
          value="Objective: Restore Power"
          position="-4 3 -13.4"
          color="#8af5d0"
          width="8"></a-text>

  <!-- GLOWING TUBES -->
  <a-cylinder position="-6 2 -14" radius="0.35" height="3.2" color="#00ffff"
              material="emissive:#00ffff; emissiveIntensity:0.9"></a-cylinder>
  <a-cylinder position="6 2 -14" radius="0.35" height="3.2" color="#ff00ff"
              material="emissive:#ff00ff; emissiveIntensity:0.9"></a-cylinder>

  <!-- EMERGENCY SCREENS -->
  <a-plane position="-9 4 -16" width="3.8" height="1.7"
           color="#220000"
           material="emissive:#220000; emissiveIntensity:1">
    <a-text value="VENT SYSTEM OVERRIDE"
            position="-1.7 0.3 0.01"
            color="#ffdddd"
            width="3.4"></a-text>
  </a-plane>

  <a-plane position="9 4 -16" width="4.5" height="1.7"
           color="#220000"
           material="emissive:#220000; emissiveIntensity:1">
    <a-text value="CONTAINMENT OVERRIDE"
            position="-2.1 0.3 0.01"
            color="#ffdddd"
            width="4.1"></a-text>
  </a-plane>

  <!-- EMERGENCY EXIT SIGN -->
  <a-plane position="0 5 1.2" width="4.5" height="1"
           color="#660000"
           material="emissive:#660000; emissiveIntensity:1">
    <a-text value="EMERGENCY EXIT LOCKED"
            position="-1.9 0.2 0.01"
            color="#ffffff"
            width="4"></a-text>
  </a-plane>

  <!-- VENTS WITH GREEN FOG LOOK -->
  <a-box class="collidable" position="6 4 -16.8" width="3.5" height="1.2" depth="0.2" color="#444"></a-box>
  <a-plane position="6 3.6 -16.7" width="3" height="0.9"
           color="#00ff55"
           material="opacity:0.12; emissive:#00ff55; emissiveIntensity:0.8"></a-plane>

  <a-box class="collidable" position="-6 4 -16.8" width="3.5" height="1.2" depth="0.2" color="#444"></a-box>
  <a-plane position="-6 3.6 -16.7" width="3" height="0.9"
           color="#00ff55"
           material="opacity:0.12; emissive:#00ff55; emissiveIntensity:0.8"></a-plane>

  <!-- SPARKS / BROKEN ELECTRICS -->
  <a-box position="-4 2 -10" width="0.2" height="0.2" depth="0.2"
         color="#ffaa00"
         material="emissive:#ffaa00; emissiveIntensity:1"
         flicker></a-box>
  <a-box position="4 2 -6" width="0.2" height="0.2" depth="0.2"
         color="#ffaa00"
         material="emissive:#ffaa00; emissiveIntensity:1"
         flicker></a-box>

  <!-- CRATES / CLUTTER -->
  <a-box class="collidable" position="-3 0.6 -4" width="1.1" height="0.7" depth="0.9" color="#2a2d30"></a-box>
  <a-box class="collidable" position="3 0.6 -4"  width="1.1" height="0.7" depth="0.9" color="#2a2d30"></a-box>

</a-scene>
</body>
</html>
