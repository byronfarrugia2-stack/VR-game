<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Working Sci‑Fi Lab</title>
  <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>

  <style>
    body { margin: 0; background: #000; }
    #hint {
      position: fixed;
      bottom: 10px;
      left: 10px;
      color: #ccc;
      font-family: sans-serif;
      background: rgba(0,0,0,0.5);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 13px;
    }
  </style>

  <script>
    /* ============================================================
       SIMPLE COLLISION SYSTEM (NO PHYSICS ENGINE)
       ============================================================ */
    AFRAME.registerComponent('player-collider', {
      schema: {
        radius: { default: 0.4 },
        height: { default: 1.6 }
      },
      init: function () {
        this.prev = new THREE.Vector3();
        this.tmpBox = new THREE.Box3();
        this.colliders = [];
        this.updateColliders();

        const obs = new MutationObserver(() => this.updateColliders());
        obs.observe(this.el.sceneEl, { childList: true, subtree: true });
      },
      updateColliders: function () {
        this.colliders = Array.from(
          this.el.sceneEl.querySelectorAll('.collidable')
        ).map(e => e.object3D);
      },
      tick: function () {
        const rig = this.el;
        this.prev.copy(rig.object3D.position);

        const pos = rig.object3D.position;
        const playerBox = new THREE.Box3(
          new THREE.Vector3(pos.x - this.data.radius, pos.y - 0.1, pos.z - this.data.radius),
          new THREE.Vector3(pos.x + this.data.radius, pos.y + this.data.height, pos.z + this.data.radius)
        );

        for (let obj of this.colliders) {
          this.tmpBox.setFromObject(obj);
          if (this.tmpBox.isEmpty()) continue;
          this.tmpBox.expandByScalar(0.05);

          if (playerBox.intersectsBox(this.tmpBox)) {
            rig.object3D.position.copy(this.prev);
            return;
          }
        }
      }
    });

    /* ============================================================
       CLICK SWITCH (for future puzzles)
       ============================================================ */
    AFRAME.registerComponent('click-switch', {
      init: function () {
        this.on = false;
        this.el.setAttribute('color', '#ff3333');
        this.el.addEventListener('click', () => {
          this.on = !this.on;
          this.el.setAttribute('color', this.on ? '#00ff66' : '#ff3333');
        });
      }
    });

    /* ============================================================
       EMISSIVE FLICKER (sparks / emergency lights)
       ============================================================ */
    AFRAME.registerComponent('flicker', {
      schema: { min: 0.2, max: 1.2, speed: 150 },
      init: function () { this.t = 0; },
      tick: function (time, dt) {
        this.t += dt;
        if (this.t > this.data.speed) {
          const val = Math.random() * (this.data.max - this.data.min) + this.data.min;
          const mat = this.el.getAttribute('material');
          mat.emissiveIntensity = val;
          this.el.setAttribute('material', mat);
          this.t = 0;
        }
      }
    });
  </script>
</head>

<body>
<div id="hint">WASD to move • Mouse to look • Click switches</div>

<a-scene background="color: #05050a">

  <!-- PLAYER RIG -->
  <a-entity id="rig" position="0 1.6 6" player-collider>
    <a-entity camera look-controls wasd-controls="acceleration:30"></a-entity>
  </a-entity>

  <!-- LIGHTING -->
  <a-entity light="type: ambient; intensity: 0.25; color: #ffffff"></a-entity>
  <a-entity light="type: directional; intensity: 0.9; color: #ffffff" position="6 12 6"></a-entity>

  <!-- Emergency red glow -->
  <a-entity light="type: point; intensity: 1.2; color: #ff2222" position="0 4 -8"></a-entity>

  <!-- ROOM STRUCTURE -->
  <a-box class="collidable" position="0 0 -8" width="26" height="0.2" depth="18" color="#1b1b1b"></a-box>
  <a-box class="collidable" position="0 6 -8" width="26" height="0.2" depth="18" color="#111"></a-box>

  <a-box class="collidable" position="0 3 -17" width="26" height="6" depth="0.2" color="#2b2b2b"></a-box>
  <a-box class="collidable" position="0 3 1"   width="26" height="6" depth="0.2" color="#2b2b2b"></a-box>

  <a-box class="collidable" position="-13 3 -8" width="0.2" height="6" depth="18" color="#2b2b2b"></a-box>
  <a-box class="collidable" position="13 3 -8"  width="0.2" height="6" depth="18" color="#2b2b2b"></a-box>

  <!-- CEILING PANELS -->
  <a-box position="-6 5.8 -8" width="4" height="0.12" depth="2"
         color="#ffffff" material="emissive:#ffffff; emissiveIntensity:0.6"></a-box>
  <a-box position="0 5.8 -8"  width="4" height="0.12" depth="2"
         color="#ffffff" material="emissive:#ffffff; emissiveIntensity:0.6"></a-box>
  <a-box position="6 5.8 -8"  width="4" height="0.12" depth="2"
         color="#ffffff" material="emissive:#ffffff; emissiveIntensity:0.6"></a-box>

  <!-- LEFT BENCH -->
  <a-box class="collidable" position="-9 1 -6" width="8" height="1" depth="2.2" color="#3a3a3a"></a-box>

  <!-- Monitor -->
  <a-box class="collidable" position="-10.2 2 -6" width="1.6" height="0.9" depth="0.08" color="#0b0b0b"></a-box>
  <a-plane position="-10.2 2 -5.95" width="1.4" height="0.8" color="#003344"
           material="emissive:#003344; emissiveIntensity:0.6">
    <a-text value="ANALYSIS" position="-0.6 0.15 0.01" color="#88ffcc" width="2.6"></a-text>
  </a-plane>

  <!-- Microscope -->
  <a-entity position="-7.2 1.2 -6.2">
    <a-cylinder radius="0.18" height="0.5" color="#222"></a-cylinder>
    <a-box position="0 0.4 0.25" width="0.36" height="0.18" depth="0.5" color="#111"></a-box>
  </a-entity>

  <!-- Petri dish -->
  <a-cylinder position="-8.2 1.12 -5.4" radius="0.18" height="0.06"
              color="#00ff55" material="emissive:#00ff55; emissiveIntensity:0.8"></a-cylinder>

  <!-- RIGHT BENCH -->
  <a-box class="collidable" position="9 1 -10" width="8" height="1" depth="2.2" color="#3a3a3a"></a-box>

  <!-- Monitor -->
  <a-box class="collidable" position="10.2 2 -10" width="1.6" height="0.9" depth="0.08" color="#0b0b0b"></a-box>
  <a-plane position="10.2 2 -9.95" width="1.4" height="0.8" color="#220033"
           material="emissive:#220033; emissiveIntensity:0.6">
    <a-text value="CONTAINMENT" position="-0.6 0.15 0.01" color="#ffcc88" width="2.6"></a-text>
  </a-plane>

  <!-- Bottles -->
  <a-cylinder class="collidable" position="8.2 1.2 -9.4" radius="0.16" height="0.5" color="#88ccff"></a-cylinder>
  <a-cylinder class="collidable" position="9.2 1.2 -9.4" radius="0.16" height="0.5" color="#ff88ff"></a-cylinder>

  <!-- CONTAINMENT POD -->
  <a-box class="collidable" position="0 1 -2" width="6" height="1" depth="4" color="#2f2f2f"></a-box>
  <a-box class="collidable" position="0 3 -2" width="4" height="4" depth="4"
         color="#666" material="opacity:0.28; transparent:true"></a-box>

  <a-plane position="0 3 -0.5" width="2.6" height="2.6"
           color="#fff" material="opacity:0.12; transparent:true"></a-plane>

  <a-sphere position="0 3 -2" radius="1.1" color="#ff3300"
            material="emissive:#ff3300; emissiveIntensity:1"
            animation="property: scale; dir: alternate; dur: 900; loop: true; to: 1.25 1.25 1.25"></a-sphere>

  <a-circle position="0 1.05 -2" rotation="-90 0 0" radius="1.4"
            color="#00ff55" material="opacity:0.65; emissive:#00ff55; emissiveIntensity:0.6"></a-circle>

  <!-- POWER CONSOLE -->
  <a-box class="collidable" position="0 1 -14" width="10" height="1.2" depth="2.6" color="#2b2b2b"></a-box>

  <a-box position="-2 2 -13.6" width="0.5" height="1" depth="0.2" click-switch></a-box>
  <a-box position="0 2 -13.6"  width="0.5" height="1" depth="0.2" click-switch></a-box>
  <a-box position="2 2 -13.6"  width="0.5" height="1" depth="0.2" click-switch></a-box>

  <a-text value="Objective: Restore Power" position="-3 3 -13.4" color="#88ff88" width="6"></a-text>

  <!-- EMERGENCY SCREENS -->
  <a-plane position="-9 4 -16" width="3.5" height="1.6" color="#220000"
           material="emissive:#220000; emissiveIntensity:0.9">
    <a-text value="VENT SYSTEM OVERRIDE" position="-1.6 0.3 0.01" color="#ffdddd" width="3.2"></a-text>
  </a-plane>

  <a-plane position="9 4 -16" width="4" height="1.6" color="#220000"
           material="emissive:#220000; emissiveIntensity:0.9">
    <a-text value="CONTAINMENT OVERRIDE" position="-1.8 0.3 0.01" color="#ffdddd" width="3.8"></a-text>
  </a-plane>

  <!-- SLIME -->
  <a-plane position="-8 0.11 -6" rotation="-90 0 0" width="3" height="2"
           color="#00ff55" material="opacity:0.7; emissive:#00ff55; emissiveIntensity:0.6"></a-plane>

  <!-- SPARKS -->
  <a-box position="-4 2 -10" width="0.2" height="0.2" depth="0.2" color="#ffaa00"
         material="emissive:#ffaa00; emissiveIntensity:0.9" flicker></a-box>

</a-scene>
</body>
</html>
