<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Ultra Detailed Modern Lab</title>
  <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>

  <style>
    body { margin: 0; background: #000; }
    #hint {
      position: fixed;
      bottom: 10px;
      left: 10px;
      color: #333;
      font-family: sans-serif;
      background: rgba(255,255,255,0.85);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 13px;
      z-index: 10;
    }
  </style>

  <script>
    /* COLLISION SYSTEM */
    AFRAME.registerComponent('player-collider', {
      schema: { radius: {default: 0.45}, height: {default: 1.6} },
      init: function () {
        this.prev = new THREE.Vector3();
        this.tmpBox = new THREE.Box3();
        this.colliders = [];
        this.updateColliders();
        const obs = new MutationObserver(() => this.updateColliders());
        obs.observe(this.el.sceneEl, { childList: true, subtree: true });
      },
      updateColliders: function () {
        this.colliders = Array.from(
          this.el.sceneEl.querySelectorAll('.collidable')
        ).map(e => e.object3D);
      },
      tick: function () {
        const rig = this.el;
        this.prev.copy(rig.object3D.position);
        const pos = rig.object3D.position;

        const playerBox = new THREE.Box3(
          new THREE.Vector3(pos.x - this.data.radius, pos.y - 0.1, pos.z - this.data.radius),
          new THREE.Vector3(pos.x + this.data.radius, pos.y + this.data.height, pos.z + this.data.radius)
        );

        for (let obj of this.colliders) {
          this.tmpBox.setFromObject(obj);
          if (this.tmpBox.isEmpty()) continue;
          this.tmpBox.expandByScalar(0.05);
          if (playerBox.intersectsBox(this.tmpBox)) {
            rig.object3D.position.copy(this.prev);
            return;
          }
        }
      }
    });

    /* SWITCHES */
    AFRAME.registerComponent('click-switch', {
      init: function () {
        this.on = false;
        this.el.setAttribute('color', '#cc0000');
        this.el.addEventListener('click', () => {
          this.on = !this.on;
          this.el.setAttribute('color', this.on ? '#00cc44' : '#cc0000');
        });
      }
    });
  </script>
</head>

<body>
<div id="hint">WASD to move • Mouse to look • Click switches</div>

<a-scene background="color: #f2f2f2">

  <!-- PLAYER -->
  <a-entity id="rig" position="0 1.6 6" player-collider>
    <a-entity camera look-controls wasd-controls="acceleration: 30"></a-entity>
  </a-entity>

  <!-- LIGHTING -->
  <a-entity light="type: ambient; intensity: 0.9; color: #ffffff"></a-entity>
  <a-entity light="type: directional; intensity: 1.4; color: #ffffff" position="6 10 6"></a-entity>

  <!-- ROOM -->
  <a-box class="collidable" position="0 0 -8" width="30" height="0.2" depth="22" color="#e6e6e6"></a-box>
  <a-box class="collidable" position="0 6 -8" width="30" height="0.2" depth="22" color="#ffffff"></a-box>

  <a-box class="collidable" position="0 3 -19" width="30" height="6" depth="0.2" color="#dcdcdc"></a-box>
  <a-box class="collidable" position="0 3 3"   width="30" height="6" depth="0.2" color="#dcdcdc"></a-box>
  <a-box class="collidable" position="-15 3 -8" width="0.2" height="6" depth="22" color="#dcdcdc"></a-box>
  <a-box class="collidable" position="15 3 -8"  width="0.2" height="6" depth="22" color="#dcdcdc"></a-box>

  <!-- CEILING LIGHT PANELS -->
  <a-box position="-8 5.8 -8" width="6" height="0.12" depth="2"
         color="#ffffff" material="emissive:#ffffff; emissiveIntensity:1"></a-box>
  <a-box position="0 5.8 -8"  width="6" height="0.12" depth="2"
         color="#ffffff" material="emissive:#ffffff; emissiveIntensity:1"></a-box>
  <a-box position="8 5.8 -8"  width="6" height="0.12" depth="2"
         color="#ffffff" material="emissive:#ffffff; emissiveIntensity:1"></a-box>

  <!-- PERIODIC TABLE -->
  <a-plane position="-13.5 3 -5" width="5" height="3"
           color="#ffffff"
           material="src:https://upload.wikimedia.org/wikipedia/commons/5/59/Periodic_Table_of_Elements.png; opacity:1"></a-plane>

  <!-- FRIDGE -->
  <a-box class="collidable" position="-13 1.5 -12" width="2" height="3" depth="2" color="#ffffff"></a-box>
  <a-text value="FRIDGE" position="-13.7 3 -12" color="#333" width="4"></a-text>

  <!-- LEFT BENCH -->
  <a-box class="collidable" position="-9 1 -6" width="12" height="1" depth="3" color="#ffffff"></a-box>

  <!-- LEFT SHELVES -->
  <a-box class="collidable" position="-9 3 -6" width="12" height="0.3" depth="1.2" color="#cccccc"></a-box>

  <!-- Bottles -->
  <a-cylinder position="-14 3.2 -6" radius="0.15" height="0.5" color="#88ccff"></a-cylinder>
  <a-cylinder position="-13 3.2 -6" radius="0.15" height="0.5" color="#ff88aa"></a-cylinder>
  <a-cylinder position="-12 3.2 -6" radius="0.15" height="0.5" color="#aaff88"></a-cylinder>
  <a-cylinder position="-11 3.2 -6" radius="0.15" height="0.5" color="#ffaa33"></a-cylinder>
  <a-cylinder position="-10 3.2 -6" radius="0.15" height="0.5" color="#33aaff"></a-cylinder>
  <a-cylinder position="-9 3.2 -6" radius="0.15" height="0.5" color="#ff3333"></a-cylinder>

  <!-- Beaker rack -->
  <a-box position="-8 1.5 -6" width="2" height="0.2" depth="1" color="#dddddd"></a-box>
  <a-cylinder position="-8.8 1.6 -6.3" radius="0.12" height="0.4" color="#88ccff"></a-cylinder>
  <a-cylinder position="-8.4 1.6 -6.3" radius="0.12" height="0.4" color="#ffaa88"></a-cylinder>
  <a-cylinder position="-8.0 1.6 -6.3" radius="0.12" height="0.4" color="#ff88ff"></a-cylinder>
  <a-cylinder position="-7.6 1.6 -6.3" radius="0.12" height="0.4" color="#aaff88"></a-cylinder>

  <!-- Test tube rack -->
  <a-box position="-7 1.5 -5.5" width="2" height="0.2" depth="0.8" color="#dddddd"></a-box>
  <a-cylinder position="-7.8 1.6 -5.5" radius="0.06" height="0.4" color="#00ccff"></a-cylinder>
  <a-cylinder position="-7.4 1.6 -5.5" radius="0.06" height="0.4" color="#ff66aa"></a-cylinder>
  <a-cylinder position="-7.0 1.6 -5.5" radius="0.06" height="0.4" color="#66ff66"></a-cylinder>
  <a-cylinder position="-6.6 1.6 -5.5" radius="0.06" height="0.4" color="#ffaa33"></a-cylinder>

  <!-- Microscope -->
  <a-entity position="-11 1.2 -6.2">
    <a-cylinder radius="0.18" height="0.5" color="#555"></a-cylinder>
    <a-box position="0 0.4 0.25" width="0.36" height="0.18" depth="0.5" color="#333"></a-box>
  </a-entity>

  <!-- Pipettes -->
  <a-box position="-10 1.5 -5.2" width="1" height="0.2" depth="0.6" color="#dddddd"></a-box>
  <a-cylinder position="-10.4 1.6 -5.2" radius="0.05" height="0.4" color="#333"></a-cylinder>
  <a-cylinder position="-10.0 1.6 -5.2" radius="0.05" height="0.4" color="#333"></a-cylinder>
  <a-cylinder position="-9.6 1.6 -5.2" radius="0.05" height="0.4" color="#333"></a-cylinder>

  <!-- RIGHT BENCH -->
  <a-box class="collidable" position="9 1 -10" width="12" height="1" depth="3" color="#ffffff"></a-box>

  <!-- RIGHT SHELVES -->
  <a-box class="collidable" position="9 3 -10" width="12" height="0.3" depth="1.2" color="#cccccc"></a-box>

  <!-- Bottles -->
  <a-cylinder position="14 3.2 -10" radius="0.15" height="0.5" color="#88ccff"></a-cylinder>
  <a-cylinder position="13 3.2 -10" radius="0.15" height="0.5" color="#ff88aa"></a-cylinder>
  <a-cylinder position="12 3.2 -10" radius="0.15" height="0.5" color="#aaff88"></a-cylinder>
  <a-cylinder position="11 3.2 -10" radius="0.15" height="0.5" color="#ffaa33"></a-cylinder>

  <!-- Centrifuge -->
  <a-box position="10 1.5 -10" width="1.2" height="0.6" depth="1.2" color="#dddddd"></a-box>

  <!-- Sink -->
  <a-box position="7 1 -10" width="2" height="1" depth="2" color="#cccccc"></a-box>
  <a-box position="7 1.3 -10" width="1.6" height="0.2" depth="1.6" color="#ffffff"></a-box>

  <!-- CONTAINMENT POD -->
  <a-box class="collidable" position="0 1 -2" width="6" height="1" depth="4" color="#ffffff"></a-box>
  <a-box class="collidable" position="0 3 -2" width="4" height="4" depth="4"
         color="#eeeeee" material="opacity:0.3; transparent:true"></a-box>

  <a-sphere position="0 3 -2" radius="1.2" color="#ff3300"
            material="emissive:#ff3300; emissiveIntensity:1.1"
            animation="property: scale; dir: alternate; dur: 900; loop: true; to: 1.3 1.3 1.3"></a-sphere>

  <!-- POWER CONSOLE -->
  <a-box class="collidable" position="0 1 -14" width="12" height="1.2" depth="2.8" color="#ffffff"></a-box>

  <a-box position="-3 2 -13.6" width="0.6" height="1.1" depth="0.25" click-switch></a-box>
  <a-box position="0 2 -13.6"  width="0.6" height="1.1" depth="0.25" click-switch></a-box>
  <a-box position="3 2 -13.6"  width="0.6" height="1.1" depth="0.25" click-switch></a-box>

  <a-text value="Objective: Restore Power"
          position="-4 3 -13.4"
          color="#333"
          width="8"></a-text>

  <!-- Screens -->
  <a-plane position="-9 4 -16" width="4" height="2"
           color="#004466"
           material="emissive:#004466; emissiveIntensity:0.8">
    <a-text value="VENT SYSTEM OVERRIDE"
            position="-1.7 0.3 0.01"
            color="#ffffff"
            width="3.4"></a-text>
  </a-plane>

  <a-plane position="9 4 -16" width="4" height="2"
           color="#330033"
           material="emissive:#330033; emissiveIntensity:0.8">
    <a-text value="CONTAINMENT OVERRIDE"
            position="-1.7 0.3 0.01"
            color="#ffffff"
            width="3.4"></a-text>
  </a-plane>

</a-scene>
</body>
</html>
