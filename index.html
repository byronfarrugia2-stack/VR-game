<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Realistic Modern Lab</title>
  <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>

  <style>
    body { margin: 0; background: #000; }
    #hint {
      position: fixed;
      bottom: 10px;
      left: 10px;
      color: #333;
      font-family: sans-serif;
      background: rgba(255,255,255,0.8);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 13px;
      z-index: 10;
    }
  </style>

  <script>
    /* SIMPLE COLLISION SYSTEM */
    AFRAME.registerComponent('player-collider', {
      schema: { radius: {default: 0.45}, height: {default: 1.6} },
      init: function () {
        this.prev = new THREE.Vector3();
        this.tmpBox = new THREE.Box3();
        this.colliders = [];
        this.updateColliders();
        const obs = new MutationObserver(() => this.updateColliders());
        obs.observe(this.el.sceneEl, { childList: true, subtree: true });
      },
      updateColliders: function () {
        this.colliders = Array.from(
          this.el.sceneEl.querySelectorAll('.collidable')
        ).map(e => e.object3D);
      },
      tick: function () {
        const rig = this.el;
        this.prev.copy(rig.object3D.position);
        const pos = rig.object3D.position;

        const playerBox = new THREE.Box3(
          new THREE.Vector3(pos.x - this.data.radius, pos.y - 0.1, pos.z - this.data.radius),
          new THREE.Vector3(pos.x + this.data.radius, pos.y + this.data.height, pos.z + this.data.radius)
        );

        for (let obj of this.colliders) {
          this.tmpBox.setFromObject(obj);
          if (this.tmpBox.isEmpty()) continue;
          this.tmpBox.expandByScalar(0.05);
          if (playerBox.intersectsBox(this.tmpBox)) {
            rig.object3D.position.copy(this.prev);
            return;
          }
        }
      }
    });

    /* SWITCHES */
    AFRAME.registerComponent('click-switch', {
      init: function () {
        this.on = false;
        this.el.setAttribute('color', '#cc0000');
        this.el.addEventListener('click', () => {
          this.on = !this.on;
          this.el.setAttribute('color', this.on ? '#00cc44' : '#cc0000');
        });
      }
    });
  </script>
</head>

<body>
<div id="hint">WASD to move • Mouse to look • Click switches</div>

<a-scene background="color: #f2f2f2">

  <!-- PLAYER -->
  <a-entity id="rig" position="0 1.6 6" player-collider>
    <a-entity camera look-controls wasd-controls="acceleration: 30"></a-entity>
  </a-entity>

  <!-- BRIGHT LAB LIGHTING -->
  <a-entity light="type: ambient; intensity: 0.9; color: #ffffff"></a-entity>
  <a-entity light="type: directional; intensity: 1.4; color: #ffffff" position="6 10 6"></a-entity>

  <!-- ROOM -->
  <a-box class="collidable" position="0 0 -8" width="28" height="0.2" depth="20" color="#e6e6e6"></a-box>
  <a-box class="collidable" position="0 6 -8" width="28" height="0.2" depth="20" color="#ffffff"></a-box>

  <a-box class="collidable" position="0 3 -18" width="28" height="6" depth="0.2" color="#dcdcdc"></a-box>
  <a-box class="collidable" position="0 3 2"   width="28" height="6" depth="0.2" color="#dcdcdc"></a-box>
  <a-box class="collidable" position="-14 3 -8" width="0.2" height="6" depth="20" color="#dcdcdc"></a-box>
  <a-box class="collidable" position="14 3 -8"  width="0.2" height="6" depth="20" color="#dcdcdc"></a-box>

  <!-- CEILING LIGHT PANELS -->
  <a-box position="-6 5.8 -8" width="4" height="0.12" depth="2"
         color="#ffffff" material="emissive:#ffffff; emissiveIntensity:1"></a-box>
  <a-box position="0 5.8 -8"  width="4" height="0.12" depth="2"
         color="#ffffff" material="emissive:#ffffff; emissiveIntensity:1"></a-box>
  <a-box position="6 5.8 -8"  width="4" height="0.12" depth="2"
         color="#ffffff" material="emissive:#ffffff; emissiveIntensity:1"></a-box>

  <!-- LEFT LAB BENCH -->
  <a-box class="collidable" position="-9 1 -6" width="10" height="1" depth="3" color="#ffffff"></a-box>

  <!-- Shelves with bottles -->
  <a-box class="collidable" position="-9 3 -6" width="10" height="0.3" depth="1.2" color="#cccccc"></a-box>

  <a-cylinder position="-12 3.2 -6" radius="0.15" height="0.5" color="#88ccff"></a-cylinder>
  <a-cylinder position="-11 3.2 -6" radius="0.15" height="0.5" color="#ff88aa"></a-cylinder>
  <a-cylinder position="-10 3.2 -6" radius="0.15" height="0.5" color="#aaff88"></a-cylinder>
  <a-cylinder position="-9 3.2 -6" radius="0.15" height="0.5" color="#ffaa33"></a-cylinder>

  <!-- Equipment -->
  <a-box position="-8 1.5 -6" width="1" height="0.6" depth="1" color="#dddddd"></a-box>
  <a-box position="-7 1.5 -6" width="1" height="0.6" depth="1" color="#dddddd"></a-box>

  <!-- RIGHT LAB BENCH -->
  <a-box class="collidable" position="9 1 -10" width="10" height="1" depth="3" color="#ffffff"></a-box>

  <!-- Shelves -->
  <a-box class="collidable" position="9 3 -10" width="10" height="0.3" depth="1.2" color="#cccccc"></a-box>

  <a-cylinder position="12 3.2 -10" radius="0.15" height="0.5" color="#88ccff"></a-cylinder>
  <a-cylinder position="11 3.2 -10" radius="0.15" height="0.5" color="#ff88aa"></a-cylinder>
  <a-cylinder position="10 3.2 -10" radius="0.15" height="0.5" color="#aaff88"></a-cylinder>

  <!-- CONTAINMENT POD (clean lab style) -->
  <a-box class="collidable" position="0 1 -2" width="6" height="1" depth="4" color="#ffffff"></a-box>
  <a-box class="collidable" position="0 3 -2" width="4" height="4" depth="4"
         color="#eeeeee" material="opacity:0.3; transparent:true"></a-box>

  <a-sphere position="0 3 -2" radius="1.2" color="#ff3300"
            material="emissive:#ff3300; emissiveIntensity:1.1"
            animation="property: scale; dir: alternate; dur: 900; loop: true; to: 1.3 1.3 1.3"></a-sphere>

  <!-- POWER CONSOLE -->
  <a-box class="collidable" position="0 1 -14" width="12" height="1.2" depth="2.8" color="#ffffff"></a-box>

  <a-box position="-3 2 -13.6" width="0.6" height="1.1" depth="0.25" click-switch></a-box>
  <a-box position="0 2 -13.6"  width="0.6" height="1.1" depth="0.25" click-switch></a-box>
  <a-box position="3 2 -13.6"  width="0.6" height="1.1" depth="0.25" click-switch></a-box>

  <a-text value="Objective: Restore Power"
          position="-4 3 -13.4"
          color="#333"
          width="8"></a-text>

  <!-- Screens -->
  <a-plane position="-9 4 -16" width="4" height="2"
           color="#004466"
           material="emissive:#004466; emissiveIntensity:0.8">
    <a-text value="VENT SYSTEM OVERRIDE"
            position="-1.7 0.3 0.01"
            color="#ffffff"
            width="3.4"></a-text>
  </a-plane>

  <a-plane position="9 4 -16" width="4" height="2"
           color="#330033"
           material="emissive:#330033; emissiveIntensity:0.8">
    <a-text value="CONTAINMENT OVERRIDE"
            position="-1.7 0.3 0.01"
            color="#ffffff"
            width="3.4"></a-text>
  </a-plane>

</a-scene>
</body>
</html>
